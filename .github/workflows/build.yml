name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          # Turn compiler errors into one annotation so they can be read through the GitHub API
          msg=$(grep -E "error:|warning: \[removal\]|FAILURE|What went wrong" -A3 build.log | head -150 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"
      - name: Check the mod jars
        run: |
          python3 tools/check_jars.py > jars.log 2>&1 || { msg=$(cat jars.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=Mod jars::${msg}"; exit 1; }
          cat jars.log
      - name: Server test
        run: .github/scripts/server-test.sh
      - name: Client screenshots
        if: success()
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
          # Fabric's client test framework can deadlock while a test world closes (game, server and test runner each
          # waiting for another). If the log goes quiet for 5 minutes, save every thread's stack, stop, and run the
          # tests once more.
          run_tests() {
            rm -f client.log hung
            timeout 1800 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace > client.log 2>&1 &
            local pid=$! last=0 quiet=0
            while kill -0 $pid 2>/dev/null; do
              sleep 15
              size=$(stat -c %s client.log 2>/dev/null || echo 0)
              if [ "$size" = "$last" ]; then quiet=$((quiet + 15)); else quiet=0; last=$size; fi
              if [ $quiet -ge 300 ]; then
                echo "No output for 5 minutes: the client tests are stuck"
                for p in $(jps -l | grep -viE "gradle|jps" | cut -d' ' -f1); do jstack "$p"; done > client-threads.txt 2>&1
                touch hung
                pkill -f runClientGameTest; pkill -f "net.fabricmc.devlaunchinjector" ; pkill -f java; sleep 5
                return 1
              fi
            done
            wait $pid
          }
          ok=0
          for attempt in 1 2; do
            if run_tests; then ok=1; break; fi
            cat client.log | tail -5
            [ -f hung ] || break
            echo "::warning title=Client test::the client tests hung (Fabric test framework deadlock); trying again ($attempt)"
            ./gradlew --stop > /dev/null 2>&1 || true
          done
          [ $ok = 1 ] || {
            msg=$( (grep -E "AssertionError|Exception|Caused by|at dev\.ahrivaea|\(ahrivaea\)|FAILURE|What went wrong|error:|Test failed|FAILED" -A1 client.log | grep -vE "flite|GLX|Realms|Narrator|resource path|Anisotropic|SignedJWT|BackendCreation|renderpearl|text2speech" | cut -c1-400 | head -40; echo "--- last lines ---"; grep -v "^\s*at " client.log | grep -vE "flite|resource path" | cut -c1-300 | tail -25) | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Client test::${msg}"
            exit 1
          }
      - name: Publish screenshots
        if: always()
        run: |
          shots=$(find . -path ./.git -prune -o -type d -name screenshots -print | head -5)
          echo "found: $shots"
          mkdir -p /tmp/shots && for d in $shots; do cp -r "$d"/. /tmp/shots/; done
          # the mods' own log lines and any errors, to read without downloading the job log
          [ -f client.log ] && grep -E "\(ahrivaea|AssertionError|Exception|Caused by|at dev\.ahrivaea" client.log | cut -c1-3000 > /tmp/shots/client-ahrivaea.log || true
          [ -f server-all.log ] && grep -E "\(ahrivaea|AHRIVAEA|Exception|Caused by|at dev\.ahrivaea|ERROR" server-all.log | cut -c1-3000 > /tmp/shots/server-ahrivaea.log || true
          [ -s client-threads.txt ] && cp client-threads.txt /tmp/shots/ || true
          [ -z "$(ls /tmp/shots)" ] && exit 0
          cd /tmp/shots && git init -q && git checkout -q -b ci-screenshots
          echo "${GITHUB_SHA}" > COMMIT
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Upload mod jars
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: ahrivaea-mods
          path: build/mods/*.jar
      - name: Publish the "latest" release (each mod's jar and the mods spreadsheet)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet openpyxl
          python3 tools/mods_sheet.py Ahrivaea_Mods.xlsx
          # Fabric API, which every mod here needs, from the build's own download of it
          FAPI_VERSION=$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)
          find ~/.gradle -name "fabric-api-${FAPI_VERSION}.jar" -not -path "*sources*" | head -1 | xargs -I{} cp {} build/mods/
          ls build/mods
          # each datapack as a zip, ready for a world's datapacks folder
          for d in datapacks/*/; do (cd "$d" && zip -qr "$GITHUB_WORKSPACE/build/mods/ahrivaea-$(basename "$d" | sed 's/^ahrivaea_//')-datapack.zip" .); done
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/mods/*.jar build/mods/*-datapack.zip Ahrivaea_Mods.xlsx --target "$GITHUB_SHA" --title "Latest mods" \
            --notes "Built from ${GITHUB_SHA}. Each ahrivaea-*.jar is one mod; fabric-api-*.jar is required by all of them (put it in the mods folder too). *-datapack.zip files go in a world's datapacks folder on the server. Ahrivaea_Mods.xlsx lists what each mod does and which worlds use it."
